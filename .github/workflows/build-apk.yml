name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk BanHang10Ty.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanHang10Ty-APK
          path: BanHang10Ty.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" BanHang10Ty.apk --clobber
          else
            gh release create "$TAG" BanHang10Ty.apk \
              --title "Bán Hàng 10 Tỷ (APK)" \
              --notes "Bản cài đặt Android APK tự động build từ GitHub Actions."
          fi
